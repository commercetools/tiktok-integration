fragment VariantPricesAndStock on ProductVariant {
  sku
  prices {
    country
    channelRef {
      id
    }
    value {
      centAmount
      currencyCode
      fractionDigits
    }
  }
  availability {
    channels(includeChannelIds: $channelIds, limit: 20) {
      results {
        channelRef {
          id
        }
        availability {
          availableQuantity
        }
      }
    }
  }
}

query FetchProductsByIds(
  $where: String!
  $locale: Locale
  $channelIds: [String!]
  $limit: Int
) {
  products(where: $where, limit: $limit) {
    results {
      id
      productTypeRef {
        id
      }
      masterData {
        current {
          name(locale: $locale)
          masterVariant {
            images {
              url
            }
            ...VariantPricesAndStock
          }
          variants {
            ...VariantPricesAndStock
          }
        }
      }
    }
  }
}
