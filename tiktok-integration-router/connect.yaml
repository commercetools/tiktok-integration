deployAs:
  - name: router-service
    applicationType: service
    endpoint: /router-service
    configuration:
      standardConfiguration:
        - key: GCP_FIRESTORE_DATABASE_ID
          description: commercetools Composable Commerce client scope
          required: true
        - key: GCP_SERVICE_ACCOUNT_CLIENT_EMAIL
          description: GCP service account email
          required: true
        - key: TIKTOK_APP_KEY
          description: TikTok app key
          required: true
        - key: JWT_EXPIRATION
          description: JWT token expiration time (e.g., 7d for 7 days)
          required: false
          default: "7d"
        - key: TIKTOK_APP_AUTHORIZATION_LINK
          description: TikTok app authorization link (get it after publishing the app in partner account)
          required: false
      securedConfiguration:
        - key: GCP_PROJECT_ID
          description: commercetools Composable Commerce client secret
          required: true
        - key: GCP_SERVICE_ACCOUNT_PRIVATE_KEY
          description: GCP private key
          required: true
        - key: TIKTOK_APP_SECRET
          description: TikTok app secret
          required: true
        - key: JWT_SECRET
          description: Secret key for JWT signing (minimum 32 characters)
          required: true