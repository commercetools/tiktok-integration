query FetchChannels($limit: Int, $offset: Int, $sort: [String!]) {
  channels(limit: $limit, offset: $offset, sort: $sort) {
    total
    count
    offset
    results {
      id
      version
      key
      roles
      nameAllLocales {
        locale
        value
      }
      descriptionAllLocales {
        locale
        value
      }
      custom {
        type {
          id
          key
        }
        customFieldsRaw {
          name
          value
        }
      }
    }
  }
}

